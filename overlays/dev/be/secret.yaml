apiVersion: v1
kind: Secret
metadata:
  name: reservation-secret
  annotations:
    avp.kubernetes.io/path: kv/data/reservation-dev-secret
type: Opaque
stringData:
  SPRING_PROFILES_ACTIVE: dev
  SWAGGER_ID: <path:kv/data/reservation-dev-secret#swagger-id>
  SWAGGER_PASSWORD: <path:kv/data/reservation-dev-secret#swagger-password>
  DB_URL: <path:kv/data/reservation-dev-secret#db-url>
  DB_USERNAME: <path:kv/data/reservation-dev-secret#db-username>
  DB_PASSWORD: <path:kv/data/reservation-dev-secret#db-password>