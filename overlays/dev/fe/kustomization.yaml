apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reservation-dev
resources:
- secret.yaml
- ../../../base/fe


patches:
- patch: |
    - op: replace
      path: /spec/tls/0/hosts/0
      value: reservation-dev.scg.skku.ac.kr

    - op: replace
      path: /spec/rules/0/host
      value: reservation-dev.scg.skku.ac.kr
  target:
    kind: Ingress
    name: reservation-fe-ingress

images:
- name: scgskku/reservation-fe
  newName: scgskku/reservation-fe-dev
- name: scgskku/reservation-fe-dev
  newTag: e99132588ad65a59f3387ccd26c1101e1036fec3-27262358822-1
