apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reservation-dev
resources:
- secret.yaml
- ../../../base/fe


patches:
- patch: |
    - op: replace
      path: /spec/tls/0/hosts/0
      value: reservation-dev.scg.skku.ac.kr

    - op: replace
      path: /spec/rules/0/host
      value: reservation-dev.scg.skku.ac.kr
  target:
    kind: Ingress
    name: reservation-fe-ingress

images:
- name: scgskku/reservation-fe
  newName: scgskku/reservation-fe-dev
- name: scgskku/reservation-fe-dev
  newTag: d54bfe5e1f57fc8a6ec596f0c240db07ae0c42f6-23789388092-3
