apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reservation-dev
resources:
- secret.yaml
- ../../../base/fe




patches:
- patch: |
    - op: replace
      path: /spec/tls/0/hosts/0
      value: reservation-dev.scg.skku.ac.kr

    - op: replace
      path: /spec/rules/0/host
      value: reservation-dev.scg.skku.ac.kr
  target:
    kind: Ingress
    name: reservation-fe-ingress

images:
- name: scgskku/reservation-fe
  newName: scgskku/reservation-fe-dev
- name: scgskku/reservation-fe-dev
  newTag: c147c7c45a8bf4a13760cd490a349a125223ecb3-23837928973-1
